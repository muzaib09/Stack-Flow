<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset password · Stack Flow</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth">
      <div class="card box">
        <div class="logo"><i>⚡</i><span class="grad">Stack Flow</span></div>
        <h2>Reset password</h2>
        <p class="sub">Enter the code and choose a new password</p>
        <form id="f">
          <div class="f">
            <label>Email</label
            ><input
              id="email"
              type="email"
              placeholder="you@shop.com"
              required
            />
          </div>
          <div class="f">
            <label>Reset code</label
            ><input id="code" type="text" placeholder="6-digit code" required />
          </div>
          <div class="f">
            <label>New password</label
            ><input
              id="pass"
              type="password"
              placeholder="Min 6 characters"
              required
            />
          </div>
          <button class="btn">Update password</button>
        </form>
        <div class="links"><a href="login.html">← Back to login</a></div>
      </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/reset.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shop Expenses · Stack Flow</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/expenses.css" />
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar"></aside>
      <main>
        <div class="top">
          <h1>Shop Expenses</h1>
          <p class="sub">Rent, bills, salaries and more</p>
        </div>
        <div class="grid g2">
          <div class="card">
            <h3>Add expense</h3>
            <form id="f">
              <div class="f">
                <label>Title</label><input id="title" required />
              </div>
              <div class="row">
                <div class="f">
                  <label>Category</label
                  ><select id="cat">
                    <option>Rent</option>
                    <option>Utilities</option>
                    <option>Salary</option>
                    <option>Transport</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="f">
                  <label>Amount</label
                  ><input id="amount" type="number" min="1" required />
                </div>
              </div>
              <div class="f">
                <label>Date</label><input id="date" type="date" required />
              </div>
              <button class="btn">Save expense</button>
            </form>
          </div>
          <div class="card">
            <h3>Summary</h3>
            <div class="chips" id="chips"></div>
          </div>
        </div>
        <div class="card">
          <h3>All expenses</h3>
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Amount</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/expenses.js"></script>
  </body>
</html>

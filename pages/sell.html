<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sell · Stack Flow</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/sell.css" />
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar"></aside>
      <main>
        <div class="top">
          <h1>Sell</h1>
          <p class="sub">Create a sale and download the invoice</p>
        </div>
        <div class="grid g2">
          <div class="card">
            <h3>Add item</h3>
            <div class="f">
              <label>Customer</label><input id="cust" placeholder="Walk-in" />
            </div>
            <div class="f">
              <label>Product</label
              ><select id="prod"></select>
            </div>
            <div class="f">
              <label>Quantity</label
              ><input id="qty" type="number" min="1" value="1" />
            </div>
            <button class="btn" id="add">+ Add to cart</button>
          </div>
          <div class="card">
            <h3>🛒 Cart</h3>
            <div class="tw">
              <table>
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="cart"></tbody>
              </table>
            </div>
            <div class="total grad" id="total"></div>
            <button class="btn" id="checkout" style="width: 100%">
              Complete sale &amp; download invoice
            </button>
          </div>
        </div>
        <div class="card">
          <h3>Sales history</h3>
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th>Invoice</th>
                  <th>Date</th>
                  <th>Customer</th>
                  <th>Total</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="hist"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/sell.js"></script>
  </body>
</html>

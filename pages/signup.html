<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account · Stack Flow</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth">
      <div class="card box">
        <div class="logo"><i>⚡</i><span class="grad">Stack Flow</span></div>
        <h2>Create account</h2>
        <p class="sub">Start tracking stock in minutes</p>
        <form id="f">
          <div class="f">
            <label>Full name</label
            ><input id="name" type="text" placeholder="Ali Khan" required />
          </div>
          <div class="f">
            <label>Email</label
            ><input
              id="email"
              type="email"
              placeholder="you@shop.com"
              required
            />
          </div>
          <div class="f">
            <label>Password</label
            ><input
              id="pass"
              type="password"
              placeholder="Min 6 characters"
              required
            />
          </div>
          <div class="f">
            <label>Confirm password</label
            ><input
              id="pass2"
              type="password"
              placeholder="Repeat password"
              required
            />
          </div>
          <button type="submit" class="btn" id="btn">
            <span id="btnText">Sign up</span>
            <span id="loader" class="loader"></span>
          </button>
        </form>
        <div class="links">
          <span>Already registered?</span><a href="login.html">Login</a>
        </div>
      </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/signup.js"></script>
  </body>
</html>

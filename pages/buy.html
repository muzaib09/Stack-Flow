<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Buy Stock · Stack Flow</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/buy.css" />
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar"></aside>
      <main>
        <div class="top">
          <h1>Buy Stock</h1>
          <p class="sub">Add new purchases and track inventory</p>
        </div>
        <div class="grid g2">
          <div class="card">
            <h3>New purchase</h3>
            <form id="f">
              <div class="f">
                <label>Product name</label
                ><input id="name" list="names" required /><datalist
                  id="names"
                ></datalist>
              </div>
              <div class="row">
                <div class="f">
                  <label>Quantity</label
                  ><input id="qty" type="number" min="1" required />
                </div>
                <div class="f"><label>Supplier</label><input id="sup" /></div>
              </div>
              <div class="row">
                <div class="f">
                  <label>Cost price</label
                  ><input id="cost" type="number" min="0" required />
                </div>
                <div class="f">
                  <label>Selling price</label
                  ><input id="price" type="number" min="0" required />
                </div>
              </div>
              <button class="btn">Add to stock</button>
            </form>
          </div>
          <div class="card">
            <h3>Recent purchases</h3>
            <div class="tw">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Supplier</th>
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody id="hist"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="card">
          <h3>Current stock</h3>
          <div class="f">
            <input id="q" placeholder="🔍 Search products..." />
          </div>
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Qty</th>
                  <th>Cost</th>
                  <th>Price</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="stock"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/buy.js"></script>
  </body>
</html>

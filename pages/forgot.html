<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot password · Stack Flow</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth">
      <div class="card box">
        <div class="logo"><i>⚡</i><span class="grad">Stack Flow</span></div>
        <h2>Forgot password</h2>
        <p class="sub">Enter your email to get a reset code</p>
        <div class="info"></div>
        <form id="f">
          <div class="f">
            <label>Email</label
            ><input
              id="email"
              type="email"
              placeholder="you@shop.com"
              required
            />
          </div>
          <button type="submit" class="btn" id="btn">
            <span id="btnText">Send reset code</span>
            <span id="loader" class="loader"></span>
          </button>
        </form>
        <div class="links"><a href="login.html">← Back to login</a></div>
      </div>
    <script src="../js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/forgot.js"></script>
  </body>
</html>
